<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1e" />
<title>Community Help — Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ---- App theme tokens (pulled verbatim from app/globals.css :root/.dark) ---- */
  :root {
    --background: oklch(0.16 0.006 285);
    --foreground: oklch(0.97 0.002 285);
    --card: oklch(0.22 0.008 285);
    --accent: oklch(0.72 0.18 55);           /* warm orange — used sparingly */
    --accent-foreground: oklch(0.99 0.005 60);
    --muted-foreground: oklch(0.7 0.006 285); /* secondary gray text */
    --border: oklch(1 0 0 / 10%);            /* hairline divider */
    --hover: oklch(1 0 0 / 4%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: oklch(0.1 0.006 285);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Mobile phone frame ~390px */
  .phone {
    width: 390px;
    max-width: 100%;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--background);
    color: var(--foreground);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ---- Post ---- */
  .post {
    display: flex;
    gap: 11px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 120ms ease;
  }
  .post:hover { background: var(--hover); }

  .avatar {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    background: linear-gradient(135deg, oklch(0.4 0.05 55), oklch(0.3 0.02 285));
  }

  .body { flex: 1 1 auto; min-width: 0; }

  /* Header row: name · handle · time  +  overflow */
  .head {
    display: flex;
    align-items: center;
    gap: 4px;
    line-height: 1.4;
    white-space: nowrap;
  }
  .name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--foreground);
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 46%;
  }
  .verify { flex: 0 0 auto; width: 15px; height: 15px; color: var(--accent); }
  .handle, .dot, .time {
    font-size: 13.5px;
    font-weight: 400;
    color: var(--muted-foreground);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dot { padding: 0 1px; }
  .more {
    margin-left: auto;
    flex: 0 0 auto;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 50%;
    color: var(--muted-foreground);
    transition: background 120ms ease, color 120ms ease;
  }
  .more:hover { background: oklch(0.72 0.18 55 / 12%); color: var(--accent); }
  .more svg { width: 16px; height: 16px; }

  /* Post text */
  .text {
    margin-top: 2px;
    font-size: 14.5px;
    font-weight: 400;
    line-height: 1.4;
    color: var(--foreground);
    white-space: pre-wrap;
  }
  .text a { color: var(--accent); text-decoration: none; }
  .text a:hover { text-decoration: underline; }

  /* ---- Slim media card (not full-width) ---- */
  .media {
    position: relative;
    margin-top: 10px;
    width: 62%;
    max-width: 230px;
    aspect-ratio: 16 / 10;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    background:
      radial-gradient(120% 90% at 30% 20%, oklch(0.34 0.03 55 / 0.55), transparent 60%),
      linear-gradient(150deg, oklch(0.28 0.015 285), oklch(0.17 0.006 285));
    cursor: pointer;
  }
  .media:hover .play { transform: translate(-50%, -50%) scale(1.06); }

  .play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-foreground);
    display: grid; place-items: center;
    box-shadow: 0 4px 14px oklch(0 0 0 / 0.35);
    transition: transform 140ms ease;
  }
  .play svg { width: 18px; height: 18px; margin-left: 2px; }

  .duration {
    position: absolute;
    right: 8px; bottom: 8px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: #fff;
    background: oklch(0 0 0 / 0.62);
    padding: 2px 6px;
    border-radius: 6px;
    backdrop-filter: blur(2px);
  }

  .caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 16px 46px 8px 10px; /* reserve right space for the duration badge */
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.35;
    color: #fff;
    background: linear-gradient(to top, oklch(0 0 0 / 0.7), transparent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---- Action row ---- */
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    max-width: 290px;
  }
  .action {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--muted-foreground);
    font-size: 12.5px;
    line-height: 1;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    transition: color 120ms ease;
  }
  .action svg { width: 15px; height: 15px; }
  .action .ico { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; transition: background 120ms ease; }
  .action:hover .ico { background: oklch(0.72 0.18 55 / 12%); }
  .action:hover { color: var(--accent); }

  /* Liked (active) state = accent */
  .action.liked { color: var(--accent); }
  .action.liked svg { fill: var(--accent); }

  .share { margin-left: auto; }
</style>
</head>
<body>
  <main class="phone">
    <article class="post">
      <!-- Avatar -->
      <img class="avatar" alt="Amara O." src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 38 38'%3E%3C/svg%3E" />

      <div class="body">
        <!-- Header: name · handle · time -->
        <div class="head">
          <span class="name">Amara Okafor</span>
          <svg class="verify" viewBox="0 0 24 24" fill="currentColor" aria-label="verified"><path d="M12 2l2.4 1.8 3 .2 1 2.8 2.2 2-1 2.8 1 2.8-2.2 2-1 2.8-3 .2L12 22l-2.4-1.8-3-.2-1-2.8L3.4 15l1-2.8-1-2.8 2.2-2 1-2.8 3-.2L12 2zm-1.3 12.6l5-5-1.3-1.3-3.7 3.7-1.8-1.8L7.6 11.5l3.1 3.1z"/></svg>
          <span class="handle">@amara_help</span>
          <span class="dot">·</span>
          <span class="time">2h</span>
          <button class="more" aria-label="More">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
        </div>

        <!-- Post text -->
        <p class="text">Does anyone in the north side have a spare car seat we could borrow for the weekend? Ours broke and we&apos;re driving out Saturday morning. Happy to return it Monday. <a href="#">#CommunityHelp</a></p>

        <!-- Slim media card -->
        <div class="media" role="button" aria-label="Play video: A quick thank-you from last week">
          <div class="play" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <span class="duration">0:42</span>
          <div class="caption">A quick thank-you from last week</div>
        </div>

        <!-- Action row -->
        <div class="actions">
          <button class="action" aria-label="Reply">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.6-.8L3 21l1.9-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg></span>
            <span>12</span>
          </button>
          <button class="action" aria-label="Repost">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>
            <span>4</span>
          </button>
          <button class="action liked" aria-label="Like" aria-pressed="true">
            <span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2 5 5.3 5c2 0 3.4 1.2 4.7 2.7C11.3 6.2 12.7 5 14.7 5 18 5 19.6 8.4 22 11.7 19.5 16.4 12 21 12 21z"/></svg></span>
            <span>128</span>
          </button>
          <button class="action share" aria-label="Share">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M8 7l4-4 4 4"/><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg></span>
          </button>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
